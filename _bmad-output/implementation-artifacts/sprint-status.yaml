ieu d'une ligne) ; trou de couverture du double croisement gauche/droite des insets fermé, mutation à l'appui ; design.json (6 snippets de CTA régénérés), DESIGN.md (3 affirmations contradictoires sur --breakpoint-lg) et CLAUDE.md §2/§10 réalignés. AC7 REJOUÉ ET PROUVÉ : harnais rendu DÉTERMINISTE par gel des animations (scripts/freeze-animations.css — prefers-reduced-motion ne convenait pas, la garde conserve chrono et barre de rebours), worktree sur 35e55b2 + HEAD servis en parallèle, même binaire ; deux passes du même code IDENTIQUES au pixel sur 12 écrans (bruit = zéro), puis base vs HEAD : 05 et 08 IDENTIQUES (les 15 270 px de la pop-up de saisie étaient bien la barre de rebours), seul 11-recap diffère de 3 693 px — le biais VOULU. La conclusion de la story était juste, c'est la preuve qui manquait. # fiche créée le 2026-09-16 (bmad-create-story) — story de REFACTOR prouvée pixel pour pixel : ligne de base de captures AVANT toute modification (harnais Playwright, 12 écrans × 3 formats), puis `useBackdropClose` (composable testé seul), `CtaButton` (6 variantes — écart assumé aux 5 de l'AC : `PASSER LE TOUR` est une famille à part dans DESIGN.md), `PopupCard` (voile + carte + fermeture), `ballAssets.ts` ; les 4 insets de position quittent `main.css` et reviennent dans l'hôte (`align` + `reserve`), `ALIGN_CLASSES` disparaît au lieu d'être partagé (2e écart) ; nettoyage 17 `touch-manipulation` sur 18 — celui de `PlayerPanel.vue:183` reste, seul élément non-`<button>` —, `min-width: 320px`, CLAUDE.md §8 réécrit, biais du récap en unités de grille ; SEUL changement visuel volontaire : le retour d'appui du CTA neutre unifié sur `brightness(1.25)` (3e écart, état enfoncé seulement). Touches alpha re-mesurées : 47,3 / 50,3 / 81,8 px — les quatre leviers chiffrés dans la fiche montrent que 57 px est inatteignable à 1133 sans passer sur la carte visée, l'exception UX-DR8 est à confirmer. Décision de Nathan à la création : la découpe Billiboard reportée par la 11.2 se prop